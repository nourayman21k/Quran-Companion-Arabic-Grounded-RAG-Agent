<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quran Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E2A2E;
    --panel: #163538;
    --panel-raised: #1C4145;
    --gold: #C9A227;
    --gold-soft: rgba(201, 162, 39, 0.16);
    --sage: #6B9C7D;
    --sage-soft: rgba(107, 156, 125, 0.16);
    --slate: #7C93A3;
    --slate-soft: rgba(124, 147, 163, 0.16);
    --text: #EDE6D6;
    --text-dim: #A9B8B6;
    --border: rgba(237, 230, 214, 0.10);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .page {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* --- Header + signature ornament band --- */
  header {
    padding: 28px 24px 0 24px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0;
    letter-spacing: 0.01em;
  }

  h1 .ar {
    font-style: italic;
    color: var(--gold);
    margin-left: 10px;
    font-size: 24px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .ornament {
    height: 14px;
    width: 100%;
    background-image: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 22px,
      rgba(201, 162, 39, 0.55) 22px,
      rgba(201, 162, 39, 0.55) 24px,
      transparent 24px,
      transparent 34px
    );
    background-position: center;
    position: relative;
    margin-bottom: 22px;
  }
  .ornament::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 6px;
    height: 1px;
    background: rgba(201, 162, 39, 0.35);
  }

  /* --- Chat area --- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 0 24px 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--panel-raised); border-radius: 4px; }

  .empty-state {
    margin-top: 40px;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
    text-align: center;
  }
  .empty-state .prompts {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 18px;
    align-items: center;
  }
  .prompt-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    max-width: 420px;
  }
  .prompt-chip:hover { border-color: var(--gold); background: var(--gold-soft); }
  .prompt-chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }

  .msg {
    max-width: 82%;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .msg.user {
    background: var(--panel-raised);
    border: 1px solid var(--border);
  }

  .msg.assistant {
    background: var(--panel);
    border-left: 3px solid var(--slate);
  }
  .msg.assistant.tool-quran_search,
  .msg.assistant.tool-hadith_search {
    border-left: 3px solid var(--gold);
  }
  .msg.assistant.tool-hadith_search { border-left-color: var(--sage); }

  .tool-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 100px;
    margin-bottom: 10px;
    font-family: 'Inter', sans-serif;
  }
  .tool-badge.quran_search { background: var(--gold-soft); color: var(--gold); }
  .tool-badge.hadith_search { background: var(--sage-soft); color: var(--sage); }
  .tool-badge.other { background: var(--slate-soft); color: var(--slate); }

  .disclaimer-note {
    display: block;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
  }

  .thinking {
    display: flex;
    gap: 4px;
    padding: 14px 16px;
  }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    animation: pulse 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* --- Composer --- */
  .composer {
    padding: 16px 24px 22px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }

  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 12px 14px;
    border-radius: 8px;
    line-height: 1.5;
    min-height: 46px;
    max-height: 140px;
  }
  textarea:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  textarea::placeholder { color: var(--text-dim); }

  button.send {
    background: var(--gold);
    color: #1a1608;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button.send:hover { filter: brightness(1.08); }
  button.send:disabled { opacity: 0.45; cursor: not-allowed; }
  button.send:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .status-line {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    padding-bottom: 8px;
  }
  .status-line.error { color: #D08B7A; }

  @media (prefers-reduced-motion: reduce) {
    .thinking span { animation: none; }
  }

  @media (max-width: 480px) {
    header { padding: 20px 16px 0 16px; }
    main { padding: 0 16px 12px 16px; }
    .composer { padding: 12px 16px 16px 16px; }
    h1 { font-size: 24px; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">Grounded in verse &amp; hadith</div>
    <h1>Quran Companion<span class="ar">القرآن</span></h1>
    <p class="subtitle">Ask about verses, stories, or teachings. Answers are retrieved from the Quran and hadith directly, with references — not generated from memory.</p>
  </header>
  <div class="ornament"></div>

  <main id="main">
    <div class="empty-state" id="emptyState">
      Every answer here is grounded in a cited verse or hadith.
      <div class="prompts">
        <button class="prompt-chip" data-prompt="What does the Quran say about patience during hardship?">What does the Quran say about patience during hardship?</button>
        <button class="prompt-chip" data-prompt="Tell me the story of Musa and the cow in Surah Al-Baqarah.">Tell me the story of Musa and the cow in Surah Al-Baqarah.</button>
        <button class="prompt-chip" data-prompt="Is there a hadith about kindness to neighbors?">Is there a hadith about kindness to neighbors?</button>
      </div>
    </div>
  </main>

  <div class="status-line" id="statusLine"></div>

  <div class="composer">
    <textarea id="input" placeholder="Ask about a verse, story, or teaching…" rows="1"></textarea>
    <button class="send" id="sendBtn">Ask</button>
  </div>
</div>

<script>
  const API_URL = "/chat"; // same-origin, since this is served by the FastAPI app itself
  const STORAGE_KEY = "quran_companion_thread_id";

  const mainEl = document.getElementById("main");
  const emptyState = document.getElementById("emptyState");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const statusLine = document.getElementById("statusLine");

  let threadId = localStorage.getItem(STORAGE_KEY) || null;
  let sending = false;

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }
  input.addEventListener("input", autoGrow);

  function toolLabel(names) {
    if (!names || names.length === 0) return null;
    if (names.includes("quran_search")) return { cls: "quran_search", label: "Quran" };
    if (names.includes("hadith_search")) return { cls: "hadith_search", label: "Hadith" };
    return { cls: "other", label: names[0] };
  }

  function addMessage(role, text, toolCalls) {
    emptyState.style.display = "none";

    const row = document.createElement("div");
    row.className = "msg-row " + role;

    const bubble = document.createElement("div");
    bubble.className = "msg " + role;

    if (role === "assistant") {
      const tool = toolLabel(toolCalls);
      if (tool) {
        bubble.classList.add("tool-" + tool.cls);
        const badge = document.createElement("span");
        badge.className = "tool-badge " + tool.cls;
        badge.textContent = tool.label === "Quran" ? "Quran verse" : tool.label === "Hadith" ? "Hadith" : tool.label;
        bubble.appendChild(badge);
        bubble.appendChild(document.createElement("br"));
      }
    }

    const textNode = document.createElement("span");
    textNode.textContent = text;
    bubble.appendChild(textNode);

    row.appendChild(bubble);
    mainEl.appendChild(row);
    mainEl.scrollTop = mainEl.scrollHeight;
  }

  function addThinking() {
    const row = document.createElement("div");
    row.className = "msg-row assistant";
    row.id = "thinkingRow";
    row.innerHTML = '<div class="msg assistant"><div class="thinking"><span></span><span></span><span></span></div></div>';
    mainEl.appendChild(row);
    mainEl.scrollTop = mainEl.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById("thinkingRow");
    if (el) el.remove();
  }

  async function send() {
    const text = input.value.trim();
    if (!text || sending) return;

    sending = true;
    sendBtn.disabled = true;
    statusLine.textContent = "";
    statusLine.className = "status-line";

    addMessage("user", text);
    input.value = "";
    autoGrow();
    addThinking();

    try {
      const resp = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, thread_id: threadId }),
      });

      if (!resp.ok) {
        throw new Error("Server responded with " + resp.status);
      }

      const data = await resp.json();
      threadId = data.thread_id;
      localStorage.setItem(STORAGE_KEY, threadId);

      removeThinking();
      addMessage("assistant", data.answer, data.tool_calls);
    } catch (err) {
      removeThinking();
      statusLine.textContent = "Couldn't reach the agent — is the server running? (" + err.message + ")";
      statusLine.className = "status-line error";
    } finally {
      sending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  document.querySelectorAll(".prompt-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      input.value = chip.dataset.prompt;
      send();
    });
  });

  input.focus();
</script>
</body>
</html>
